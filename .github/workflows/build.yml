name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Fable
        run: dotnet tool install --global fable

      - name: Install dependencies
        run: npm ci

      - name: Build (fable + render)
        run: npm run build

      # Vercel deploys the committed dist/ verbatim (its build image has no
      # .NET SDK), so this is the single source of truth: on pushes, CI
      # commits a freshly built dist/ whenever it differs from the tracked
      # one ([skip ci] prevents a re-trigger). The F# source always wins.
      - name: Commit refreshed dist
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "chore: refresh dist from F# build [skip ci]"
            git push origin "HEAD:refs/heads/$BRANCH"
            echo "committed refreshed dist/"
          else
            echo "committed dist/ already matches the build"
          fi

      # On pull requests nothing may be committed, so a stale dist/ is a
      # warning for reviewers, not a failure (CI refreshes it on push).
      - name: Check dist freshness (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          if git ls-files dist --error-unmatch >/dev/null 2>&1; then
            if [ -n "$(git status --porcelain dist)" ]; then
              echo "::warning::dist/ is stale for this PR — CI refreshes it when the branch is pushed/merged."
            fi
          else
            echo "::warning::dist/ is not tracked yet — CI commits it on the next push."
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Runtime QA
        run: npm run qa

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa-report.json
        continue-on-error: true
